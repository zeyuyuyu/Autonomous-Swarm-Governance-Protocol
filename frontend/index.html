<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwarmGov - Level Up Democracy!</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
</head>
<body class="bg-gradient-to-br from-purple-900 to-indigo-900 text-white min-h-screen">
    <div id="confetti-canvas" class="fixed inset-0 pointer-events-none"></div>
    
    <nav class="p-4 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <img src="/assets/logo.svg" class="h-8 animate-pulse" alt="SwarmGov Logo">
            <span class="text-2xl font-bold">SwarmGov</span>
        </div>
        <div class="flex items-center space-x-4">
            <div class="flex items-center bg-purple-800 rounded-full px-4 py-2">
                <span class="mr-2">🏆</span>
                <span id="points">1,234</span>
            </div>
            <div class="relative">
                <img src="https://api.dicebear.com/6.x/avataaars/svg?seed=Felix" class="h-10 w-10 rounded-full border-2 border-purple-500">
                <div class="absolute -top-1 -right-1 bg-green-500 h-3 w-3 rounded-full border-2 border-white"></div>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-8">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="bg-white/10 backdrop-blur-lg rounded-xl p-6 space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="text-xl font-bold">Active Proposals</h2>
                    <span class="bg-purple-600 rounded-full px-3 py-1 text-sm">Level 5 Required</span>
                </div>
                <div class="space-y-4" id="proposals">
                    <!-- Dynamic Proposal Cards -->
                </div>
            </div>

            <div class="space-y-8">
                <div class="bg-white/10 backdrop-blur-lg rounded-xl p-6">
                    <h2 class="text-xl font-bold mb-4">Your Achievements</h2>
                    <div class="grid grid-cols-3 gap-4">
                        <div class="achievement-card text-center p-4 bg-purple-800 rounded-lg hover:scale-105 transition-transform cursor-pointer">
                            <span class="text-3xl">🎯</span>
                            <p class="text-sm mt-2">First Vote</p>
                        </div>
                        <div class="achievement-card text-center p-4 bg-purple-800/50 rounded-lg hover:scale-105 transition-transform cursor-pointer">
                            <span class="text-3xl">⭐</span>
                            <p class="text-sm mt-2">Top Voter</p>
                        </div>
                        <div class="achievement-card text-center p-4 bg-purple-800/50 rounded-lg hover:scale-105 transition-transform cursor-pointer">
                            <span class="text-3xl">🚀</span>
                            <p class="text-sm mt-2">Trend Setter</p>
                        </div>
                    </div>
                </div>

                <div class="bg-white/10 backdrop-blur-lg rounded-xl p-6">
                    <h2 class="text-xl font-bold mb-4">Leaderboard</h2>
                    <div class="space-y-4">
                        <div class="flex items-center justify-between bg-purple-800/50 p-3 rounded-lg">
                            <div class="flex items-center space-x-3">
                                <span class="text-xl">👑</span>
                                <img src="https://api.dicebear.com/6.x/avataaars/svg?seed=Alex" class="h-8 w-8 rounded-full">
                                <span>Alex.eth</span>
                            </div>
                            <span>12,345 pts</span>
                        </div>
                        <!-- More leaderboard entries -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="achievement-popup" class="fixed bottom-4 right-4 bg-green-500 text-white p-4 rounded-lg shadow-lg hidden animate__animated animate__fadeInUp">
        <div class="flex items-center space-x-3">
            <span class="text-2xl">🏆</span>
            <div>
                <h3 class="font-bold">Achievement Unlocked!</h3>
                <p class="text-sm">First Proposal Created</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.4.0/dist/confetti.browser.min.js"></script>
    <script>
        // Gamification Logic
        function showAchievement(title) {
            const popup = document.getElementById('achievement-popup');
            popup.classList.remove('hidden');
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });
            setTimeout(() => popup.classList.add('hidden'), 3000);
        }

        // Social Features
        function shareAchievement() {
            // Social media sharing implementation
        }

        // Dynamic Content Loading
        function loadProposals() {
            // Fetch and display proposals with animations
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadProposals();
            // Show welcome achievement for new users
            setTimeout(() => showAchievement('Welcome!'), 1000);
        });
    </script>
</body>
</html>
