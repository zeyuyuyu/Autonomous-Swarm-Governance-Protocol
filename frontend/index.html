<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwarmRank - Compete in the Hive!</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/confetti-js@0.0.18/dist/index.min.js"></script>
</head>
<body class="bg-gray-900 text-white">
    <div id="confetti-canvas" class="fixed top-0 left-0 w-full h-full pointer-events-none"></div>
    
    <nav class="bg-gray-800 p-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">🐝 SwarmRank</h1>
            <div class="flex items-center space-x-4">
                <span class="text-yellow-400">⭐ Your Influence: <span id="influence-score">1,234</span></span>
                <span class="text-green-400">🏆 Rank: #<span id="user-rank">42</span></span>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Achievement System -->
            <div class="bg-gray-800 rounded-lg p-6 shadow-lg">
                <h2 class="text-xl font-bold mb-4">🎯 Daily Challenges</h2>
                <div class="space-y-4">
                    <div class="flex justify-between items-center">
                        <div>
                            <h3 class="font-semibold">Submit 3 Proposals</h3>
                            <div class="w-48 bg-gray-700 rounded-full h-2">
                                <div class="bg-blue-500 rounded-full h-2 w-2/3"></div>
                            </div>
                        </div>
                        <span class="text-blue-400">+500 XP</span>
                    </div>
                    <!-- More challenges... -->
                </div>
            </div>

            <!-- Social Feed -->
            <div class="bg-gray-800 rounded-lg p-6 shadow-lg">
                <h2 class="text-xl font-bold mb-4">🔥 Trending Proposals</h2>
                <div class="space-y-4" id="proposal-feed">
                    <!-- Dynamic proposal cards -->
                </div>
            </div>
        </div>

        <!-- Gamification Elements -->
        <div class="mt-8 bg-gray-800 rounded-lg p-6 shadow-lg">
            <h2 class="text-xl font-bold mb-4">🌟 Your Impact Journey</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
                <div class="bg-gray-700 rounded-lg p-4">
                    <div class="text-3xl font-bold text-yellow-400">24</div>
                    <div class="text-sm text-gray-400">Proposals Created</div>
                </div>
                <div class="bg-gray-700 rounded-lg p-4">
                    <div class="text-3xl font-bold text-green-400">89%</div>
                    <div class="text-sm text-gray-400">Approval Rate</div>
                </div>
                <div class="bg-gray-700 rounded-lg p-4">
                    <div class="text-3xl font-bold text-blue-400">156</div>
                    <div class="text-sm text-gray-400">Supporters</div>
                </div>
                <div class="bg-gray-700 rounded-lg p-4">
                    <div class="text-3xl font-bold text-purple-400">Level 8</div>
                    <div class="text-sm text-gray-400">Influence Tier</div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Initialize confetti for achievements
        const confetti = new ConfettiGenerator({
            target: 'confetti-canvas',
            max: 80,
            size: 1.5,
            animate: true,
            respawn: false
        });

        // Simulate achievement unlock
        setTimeout(() => {
            confetti.render();
            setTimeout(() => confetti.clear(), 2500);
        }, 1000);

        // Real-time feed updates
        setInterval(() => {
            const feed = document.getElementById('proposal-feed');
            const newProposal = document.createElement('div');
            newProposal.className = 'bg-gray-700 rounded p-4 animate-pulse';
            newProposal.innerHTML = `
                <div class="flex justify-between items-center">
                    <h3 class="font-semibold">New Community Proposal</h3>
                    <span class="text-sm text-gray-400">Just now</span>
                </div>
                <p class="text-sm text-gray-300 mt-2">A new proposal needs your vote!</p>
                <div class="flex space-x-2 mt-2">
                    <button class="px-3 py-1 bg-green-600 rounded-full text-sm">Support</button>
                    <button class="px-3 py-1 bg-red-600 rounded-full text-sm">Decline</button>
                </div>
            `;
            feed.insertBefore(newProposal, feed.firstChild);
            if (feed.children.length > 5) feed.removeChild(feed.lastChild);
        }, 5000);
    </script>
</body>
</html>
